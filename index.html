<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porsche 911 GT3 RS (992) · 3D 内部结构拆解</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:#030405;color:#e6eef8;
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;position:absolute;inset:0;z-index:0;cursor:grab}
  canvas:active{cursor:grabbing}

  /* ---------- 标签层 ---------- */
  #labels{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .label{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(.9);
    padding:6px 14px;border-radius:6px;white-space:nowrap;
    background:rgba(8, 12, 16, 0.85);
    border-left: 3px solid #00e5ff;
    box-shadow:0 0 20px rgba(0,229,255,.15),0 4px 16px rgba(0,0,0,.8);
    opacity:0;transition:opacity .2s, transform .2s;
    font-size:12px;font-weight:700;letter-spacing:.5px;color:#fff;
    pointer-events:none;backdrop-filter:blur(4px);
  }
  .label.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .label small{display:block;font-size:10px;font-weight:400;color:#8ba6ba;letter-spacing:.5px;margin-top:3px}

  /* ---------- 顶栏 ---------- */
  #topbar{
    position:absolute;z-index:6;top:0;left:0;right:0;height:80px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;pointer-events:none;
  }
  #topbar::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(3,4,5,.95),rgba(3,4,5,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;position:relative}
  .brand-mark{
    width:46px;height:46px;border-radius:8px;display:grid;place-items:center;
    font-size:15px;font-weight:800;letter-spacing:-.5px;color:#000;
    background:#fff; clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
    box-shadow:0 0 26px rgba(255,255,255,.2);
  }
  .brand-text h1{
    font-size:18px;font-weight:800;letter-spacing:4px;color:#fff;
  }
  .brand-text p{font-size:11px;color:#5e88a8;letter-spacing:2px;margin-top:2px}

  .top-actions{display:flex;gap:10px;position:relative;pointer-events:auto}
  .btn{
    pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.15);
    background:rgba(20,25,30,.8);color:#b7dcf5;padding:9px 18px;border-radius:6px;
    font-size:12.5px;font-weight:600;letter-spacing:.6px;font-family:inherit;
    transition:.2s;backdrop-filter:blur(10px);
  }
  .btn:hover{border-color:rgba(0,229,255,.8);color:#00e5ff;background:rgba(0,229,255,.1);box-shadow:0 0 18px rgba(0,229,255,.2)}
  .btn.primary{
    background:#fff;border-color:#fff;color:#000;font-weight:800;
  }
  .btn.primary:hover{background:#e0e0e0;box-shadow:0 0 20px rgba(255,255,255,.4)}

  /* ---------- 面板 ---------- */
  .panel{
    position:absolute;z-index:5;
    background:rgba(10,14,18,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;backdrop-filter:blur(20px);
    box-shadow:0 10px 44px rgba(0,0,0,.8);
  }

  #listPanel{left:24px;top:96px;width:230px;padding:16px 12px 12px;max-height:calc(100vh - 180px);display:flex;flex-direction:column}
  .panel-title{
    font-size:11.5px;letter-spacing:2px;color:#8ba6ba;font-weight:700;
    padding:0 6px 12px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;flex:none;
  }
  .panel-title span{color:#00e5ff;font-size:10.5px;letter-spacing:1px}

  .part-list{flex:1;overflow-y:auto;padding-right:4px}
  .part-list::-webkit-scrollbar{width:3px}
  .part-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}

  .part-item{
    display:flex;align-items:center;gap:9px;cursor:pointer;
    padding:8px 10px;border-radius:6px;margin-bottom:4px;
    font-size:12.5px;color:#8ba6ba;transition:.16s;
  }
  .part-item:hover{background:rgba(255,255,255,.05);color:#fff}
  .part-item.active{
    background:rgba(0,229,255,.1);color:#00e5ff;
    border-left:2px solid #00e5ff;
  }
  .part-item .idx{
    width:18px;height:18px;border-radius:4px;display:grid;place-items:center;
    font-size:10px;font-weight:800;background:rgba(255,255,255,.08);color:#b7dcf5;flex:none;
  }
  .part-item.active .idx{background:#00e5ff;color:#000}
  .part-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 信息面板 ---------- */
  #infoPanel{
    right:24px;top:96px;width:300px;padding:20px;opacity:0;transform:translateX(14px);
    pointer-events:none;transition:opacity .25s, transform .25s;
  }
  #infoPanel.show{opacity:1;transform:translateX(0);pointer-events:auto}
  .info-head{display:flex;align-items:baseline;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .info-head h2{font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px}
  .info-head .en{font-size:10.5px;color:#00e5ff;letter-spacing:1.4px;text-transform:uppercase}
  .info-specs{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .spec-row{
    display:flex;justify-content:space-between;gap:10px;font-size:11.5px;
    padding:7px 10px;border-radius:4px;background:rgba(255,255,255,.03);
    border-left:2px solid rgba(255,255,255,.2);
  }
  .spec-row span{color:#8ba6ba}
  .spec-row b{color:#fff;font-weight:700;letter-spacing:.3px}
  .info-desc{font-size:11.5px;line-height:1.75;color:#b0c4d4;margin-bottom:18px}
  #infoPanel .btn{width:100%;text-align:center}

  /* ---------- 底部提示 ---------- */
  #hint{
    position:absolute;z-index:6;bottom:22px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5e88a8;letter-spacing:1.2px;display:flex;align-items:center;gap:8px;
    padding:8px 18px;border-radius:20px;background:rgba(3,4,5,.8);
    border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);
  }
  .dot{
    width:6px;height:6px;border-radius:50%;background:#00e5ff;flex:none;
    box-shadow:0 0 10px #00e5ff;animation:pulse 1.8s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

  /* ---------- 加载 ---------- */
  #loader{
    position:absolute;inset:0;z-index:20;display:grid;place-items:center;
    background:#030405;transition:opacity .6s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spin{
    width:40px;height:40px;border-radius:50%;
    border:2px solid rgba(255,255,255,.1);border-top-color:#00e5ff;
    animation:rot .8s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}

  @media (max-width:900px){
    #listPanel{display:none}
    #infoPanel{right:12px;left:12px;width:auto;top:auto;bottom:70px}
    #topbar{padding:0 14px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="labels"></div>

  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">911</div>
      <div class="brand-text">
        <h1>GT3 RS (992)</h1>
        <p>INTERNAL STRUCTURE EXPLODED VIEW</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnAll" class="btn primary">全部拆解</button>
      <button id="btnReset" class="btn">复位视角</button>
    </div>
  </header>

  <aside id="listPanel" class="panel">
    <div class="panel-title">内部结构分解 <span id="partCount">0</span></div>
    <div id="partList" class="part-list"></div>
  </aside>

  <aside id="infoPanel" class="panel"></aside>

  <footer id="hint">
    <span class="dot"></span> 拖拽旋转 · 滚轮缩放 · 点击部件查看详情
  </footer>

  <div id="loader"><div class="spin"></div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   1. 场景与渲染器
   ========================================================= */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030405);
scene.fog = new THREE.FogExp2(0x030405, 0.015);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
camera.position.set(9, 4.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.5;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* =========================================================
   2. 灯光与背景
   ========================================================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x080808, 0.7));

// 主光源，打亮哑光车漆
const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(10, 15, 10);
scene.add(keyLight);

// 轮廓光，勾勒车身线条
const rimLight = new THREE.DirectionalLight(0x00e5ff, 3.0);
rimLight.position.set(-10, 8, -10);
scene.add(rimLight);

// 补光
const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
fillLight.position.set(-5, 5, 10);
scene.add(fillLight);

// 底部氛围光
const glowPoint = new THREE.PointLight(0x00e5ff, 20, 20, 2);
glowPoint.position.set(0, -1.5, 0);
scene.add(glowPoint);

// 星空粒子
(function buildStars() {
  const COUNT = 800;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r = 30 + Math.random() * 50;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(Math.random() * 2 - 1);
    pos[i * 3]     = r * Math.sin(p) * Math.cos(t);
    pos[i * 3 + 1] = r * Math.cos(p) * 0.6 + 5;
    pos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x4a9ad8, size: 0.15, transparent: true, opacity: 0.5,
    sizeAttenuation: true, depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* =========================================================
   3. 部件管理系统
   ========================================================= */
const parts = [];
const partsById = {};
const clickTargets = [];
const GLOW_COLOR = new THREE.Color(0x00e5ff);
const ZERO = new THREE.Vector3();

function makePart(cfg) {
  const group = new THREE.Group();
  group.name = cfg.id;
  scene.add(group);

  const part = {
    id: cfg.id,
    name: cfg.name,
    en: cfg.en,
    tag: cfg.tag || '',
    specs: cfg.specs || [],
    desc: cfg.desc || '',
    explode: new THREE.Vector3(cfg.explode[0], cfg.explode[1], cfg.explode[2]),
    group,
    matData: [],
    exploded: false,
    glow: 0,
    labelAnchor: new THREE.Vector3(),
    labelEl: null
  };
  parts.push(part);
  partsById[part.id] = part;
  return part;
}

function addMesh(parent, geo, mat, pos = [0,0,0], rot = [0,0,0], scale = [1,1,1]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  parent.add(m);
  return m;
}

// 材质库
const MATS = {
  // 哑光黑武士车漆 (GT3 RS)
  body: new THREE.MeshStandardMaterial({ 
    color: 0x151515, metalness: 0.85, roughness: 0.4, envMapIntensity: 1.5 
  }),
  // 碳纤维
  carbon: new THREE.MeshStandardMaterial({ 
    color: 0x0a0a0a, metalness: 0.9, roughness: 0.3 
  }),
  // 玻璃
  glass: new THREE.MeshStandardMaterial({ 
    color: 0x05080c, metalness: 1, roughness: 0.05, transparent: true, opacity: 0.85 
  }),
  // 哑光黑塑料 (进气格栅/扩散器)
  plastic: new THREE.MeshStandardMaterial({ 
    color: 0x0f0f0f, metalness: 0.2, roughness: 0.8 
  }),
  // 金属 (发动机/排气)
  metal: new THREE.MeshStandardMaterial({ 
    color: 0x8b939d, metalness: 0.95, roughness: 0.3 
  }),
  // 钛合金排气 (烧蓝效果稍后处理)
  titanium: new THREE.MeshStandardMaterial({ 
    color: 0x5d666f, metalness: 1.0, roughness: 0.2 
  }),
  // 红色卡钳
  caliper: new THREE.MeshStandardMaterial({ 
    color: 0xcc0000, metalness: 0.4, roughness: 0.4, emissive: 0x330000 
  }),
  // 碳陶刹车盘
  ceramic: new THREE.MeshStandardMaterial({ 
    color: 0x333333, metalness: 0.6, roughness: 0.7 
  }),
  // 轮毂黑色
  rim: new THREE.MeshStandardMaterial({ 
    color: 0x1a1a1a, metalness: 0.95, roughness: 0.2 
  }),
  // 轮胎
  tire: new THREE.MeshStandardMaterial({ 
    color: 0x0d0d0d, roughness: 0.95 
  }),
  // 发光件
  light: new THREE.MeshStandardMaterial({ 
    color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 
  }),
  taillight: new THREE.MeshStandardMaterial({ 
    color: 0xff1111, emissive: 0xff0000, emissiveIntensity: 3, roughness: 0.2 
  })
};

/* =========================================================
   4. 车身主体 (黑武士 GT3 RS)
   ========================================================= */
// 侧面轮廓，精准复刻992 GT3 RS的低趴与溜背
function createBodyShape() {
  const pts = [
    [-2.15, 0.15], [-2.28, 0.48], [-2.22, 0.85], [-2.05, 1.02], 
    [-1.65, 1.06], [-1.05, 1.15], [-0.35, 1.38], [ 0.35, 1.38], 
    [ 0.90, 1.15], [ 1.45, 0.95], [ 1.98, 0.85], [ 2.18, 0.62], 
    [ 2.22, 0.35], [ 2.05, 0.15]
  ].map(p => new THREE.Vector2(p[0], p[1]));
  
  const curve = new THREE.SplineCurve(pts);
  const outline = curve.getPoints(180);
  const shape = new THREE.Shape(outline);

  // 轮拱 (GT3 RS 宽体)
  const rearArch = new THREE.Path();
  rearArch.absarc(-1.35, 0.50, 0.40, 0, Math.PI * 2, true);
  shape.holes.push(rearArch);

  const frontArch = new THREE.Path();
  frontArch.absarc(1.35, 0.48, 0.38, 0, Math.PI * 2, true);
  shape.holes.push(frontArch);

  return shape;
}

const bodyPart = makePart({
  id: 'body',
  name: '车身外壳 & 碳纤维机盖',
  en: 'Body Shell & Carbon Hood',
  tag: '轻量化 · NACA导流',
  specs: [['材质', '铝/碳纤维复合'], ['机盖', '碳纤维带导流槽']],
  desc: '992 GT3 RS 采用极度轻量化的车身结构，前机盖由碳纤维制成，并带有两个巨大的NACA导流槽，用于梳理前部气流并增加下压力。',
  explode: [0, 3.6, 0]
});

{
  const geo = new THREE.ExtrudeGeometry(createBodyShape(), {
    depth: 1.82, // GT3 RS 更宽
    bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 3, curveSegments: 16
  });
  geo.translate(0, 0, -0.91);
  bodyPart.group.add(new THREE.Mesh(geo, MATS.body));

  // 前机盖 NACA 导流槽 (用黑色凹陷面片模拟)
  [-1, 1].forEach(s => {
    addMesh(bodyPart.group, new THREE.BoxGeometry(0.35, 0.02, 0.12), MATS.plastic, [1.3, 1.0, s * 0.35], [0, 0, -0.1]);
  });

  // 侧翼子板百叶窗 (GT3 RS 标志性)
  [-1, 1].forEach(s => {
    for(let i=0; i<3; i++) {
      addMesh(bodyPart.group, new THREE.BoxGeometry(0.15, 0.03, 0.01), MATS.plastic, [0.85, 1.02 - i*0.03, s * 0.91], [0, 0, 0.2]);
    }
  });

  // 隐藏式门把手
  [-1, 1].forEach(s => {
    addMesh(bodyPart.group, new THREE.BoxGeometry(0.22, 0.025, 0.02), MATS.carbon, [0.3, 0.82, s * 0.915]);
  });

  // 侧裙拉花 "GT3 RS"
  const decalMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
  [-1, 1].forEach(s => {
    addMesh(bodyPart.group, new THREE.BoxGeometry(0.8, 0.15, 0.01), decalMat, [0.1, 0.35, s * 0.915]);
  });
}

/* =========================================================
   5. 空气动力学套件 (GT3 RS 灵魂)
   ========================================================= */
const aeroPart = makePart({
  id: 'aero',
  name: '空气动力学套件',
  en: 'Aerodynamics Package',
  tag: '天鹅颈尾翼 · 前风刀',
  specs: [['尾翼', 'DRS 可调'], ['前部', '主动式风刀']],
  desc: 'GT3 RS 拥有量产车中最夸张的空力套件，包括巨大的天鹅颈式尾翼、前保险杠两侧的风刀，以及车尾底部的扩散器，可在高速时产生超过800kg的下压力。',
  explode: [0, 2.0, 3.0]
});

{
  // 天鹅颈大尾翼
  const wingGrp = new THREE.Group();
  wingGrp.position.set(-1.95, 1.45, 0);
  // 翼面
  addMesh(wingGrp, new THREE.BoxGeometry(0.5, 0.03, 1.9), MATS.carbon, [0, 0, 0], [0, 0, -0.08]);
  addMesh(wingGrp, new THREE.BoxGeometry(0.1, 0.12, 1.9), MATS.carbon, [-0.2, 0.05, 0]); // 襟翼
  // 天鹅颈支架
  [-1, 1].forEach(s => {
    addMesh(wingGrp, new THREE.CylinderGeometry(0.03, 0.03, 0.5, 12), MATS.carbon, [0.1, -0.2, s * 0.6], [0, 0, 0.4]);
  });
  // 端板
  [-1, 1].forEach(s => {
    addMesh(wingGrp, new THREE.BoxGeometry(0.45, 0.2, 0.02), MATS.carbon, [-0.05, 0.05, s * 0.95]);
  });
  aeroPart.group.add(wingGrp);

  // 前风刀 (Canards)
  [-1, 1].forEach(s => {
    addMesh(aeroPart.group, new THREE.BoxGeometry(0.25, 0.02, 0.1), MATS.carbon, [2.05, 0.35, s * 0.85], [0, 0, 0.15]);
  });

  // 后扩散器
  addMesh(aeroPart.group, new THREE.BoxGeometry(0.5, 0.15, 1.4), MATS.carbon, [-2.05, 0.15, 0], [0, 0, -0.2]);
}

/* =========================================================
   6. 车门
   ========================================================= */
const doorsPart = makePart({
  id: 'doors',
  name: '轻量化车门',
  en: 'Lightweight Doors',
  tag: '碳纤维门板',
  specs: [['材质', '碳纤维'], ['设计', '无框 / 拉环']],
  desc: '采用碳纤维材质车门，内部取消传统把手改用拉环，进一步降低整车重量。',
  explode: [0, 0.5, 2.8]
});

{
  [-1, 1].forEach(s => {
    const doorGrp = new THREE.Group();
    doorGrp.position.set(0, 0, s * 0.8);
    
    // 门外皮
    addMesh(doorGrp, new THREE.BoxGeometry(1.7, 0.6, 0.08), MATS.body, [0.1, 0.7, s * 0.08]);
    // 门内饰板
    addMesh(doorGrp, new THREE.BoxGeometry(1.6, 0.55, 0.04), MATS.carbon, [0.1, 0.7, 0]);
    // 侧窗
    addMesh(doorGrp, new THREE.BoxGeometry(1.1, 0.4, 0.02), MATS.glass, [-0.1, 1.2, s * 0.08], [0, 0, 0.15]);

    doorsPart.group.add(doorGrp);
  });
}

/* =========================================================
   7. 前后保险杠 & 灯组
   ========================================================= */
const frontBumperPart = makePart({
  id: 'front_bumper',
  name: '前保险杠 & 矩阵大灯',
  en: 'Front Bumper & Headlights',
  tag: '四点式 LED',
  specs: [['大灯', '矩阵式LED'], ['进气', '中央双口']],
  desc: '992代前脸，GT3 RS特有巨大的中央进气口和两侧导流槽，四点式LED日间行车灯极具辨识度。',
  explode: [2.5, 0, 0]
});

/* =========================================================
   8. 极致细节：轮毂与刹车 (GT3 RS 实车还原)
   ========================================================= */
function createWheel(id, name, x, z, explodeDir) {
  const part = makePart({
    id, name,
    en: z > 0 ? 'Wheel LH' : 'Wheel RH',
    tag: '中央锁止 · 碳陶刹车',
    specs: [['轮毂', '锻造镁合金'], ['刹车', 'PCCB 碳陶']],
    desc: 'GT3 RS 采用中央锁止轻量化锻造轮毂，内部配备保时捷碳陶复合制动系统（PCCB），提供无与伦比的抗热衰退性能和制动力。',
    explode: explodeDir
  });

  const y = 0.42;
  const R = 0.43; // 胎壁很薄
  const side = Math.sign(z);

  // 轮胎主体 (低扁平比)
  addMesh(part.group, new THREE.CylinderGeometry(R, R, 0.34, 36), MATS.tire, [x, y, z], [Math.PI/2, 0, 0]);
  // 胎侧倒角
  addMesh(part.group, new THREE.CylinderGeometry(R*0.9, R*0.9, 0.35, 36), MATS.tire, [x, y, z], [Math.PI/2, 0, 0]);

  // 轮毂
  const faceZ = z + side * 0.12;
  // 轮毂外圈
  const rimRing = new THREE.TorusGeometry(R*0.85, 0.03, 16, 32);
  addMesh(part.group, rimRing, MATS.rim, [x, y, faceZ]);
  
  // 复杂的 Y 型辐条 (使用多个 Box 旋转阵列)
  for(let i=0; i<10; i++) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, faceZ);
    pivot.rotation.z = (i / 10) * Math.PI * 2;
    
    // Y型分叉
    addMesh(pivot, new THREE.BoxGeometry(0.04, 0.18, 0.02), MATS.rim, [0, 0.08, 0]);
    addMesh(pivot, new THREE.BoxGeometry(0.02, 0.15, 0.02), MATS.rim, [0.04, 0.22, 0], [0, 0, -0.3]);
    addMesh(pivot, new THREE.BoxGeometry(0.02, 0.15, 0.02), MATS.rim, [-0.04, 0.22, 0], [0, 0, 0.3]);
    
    part.group.add(pivot);
  }
  
  // 中央锁止盖
  addMesh(part.group, new THREE.CylinderGeometry(0.08, 0.08, 0.35, 16), MATS.rim, [x, y, z], [Math.PI/2, 0, 0]);
  addMesh(part.group, new THREE.CylinderGeometry(0.04, 0.04, 0.36, 16), MATS.light, [x, y, z], [Math.PI/2, 0, 0]); // 中心保时捷标高光

  // 碳陶刹车盘 (带打孔效果，用黑色小圆柱模拟)
  addMesh(part.group, new THREE.CylinderGeometry(0.26, 0.26, 0.035, 32), MATS.ceramic, [x, y, z - side * 0.06], [Math.PI/2, 0, 0]);
  
  // 巨大的前6后4卡钳
  const caliperGrp = new THREE.Group();
  caliperGrp.position.set(x - 0.18, y + 0.12, z - side * 0.06);
  addMesh(caliperGrp, new THREE.BoxGeometry(0.1, 0.22, 0.08), MATS.caliper);
  addMesh(caliperGrp, new THREE.BoxGeometry(0.02, 0.15, 0.09), MATS.light, [0.06, 0, 0]); // 卡钳上的发光字
  part.group.add(caliperGrp);

  return part;
}

   12. 系统初始化与交互逻辑

parts.forEach(part => {
  part.group.traverse(obj => {
    if (!obj.isMesh) return;
    obj.material = obj.material.clone();
    obj.userData.partId = part.id;
    clickTargets.push(obj);

    // 保存基础发光属性，以便后续做高亮
    part.matData.push({
      mat: obj.material,
      baseEmissive: obj.material.emissive.clone(),
      baseIntensity: obj.material.emissiveIntensity || 1
    });
  });

  const box = new THREE.Box3().setFromObject(part.group);
  box.getCenter(part.labelAnchor);
});

const listEl = document.getElementById('partList');
const infoEl = document.getElementById('infoPanel');
const btnAll = document.getElementById('btnAll');
const btnReset = document.getElementById('btnReset');
let selectedPart = null;
let hoveredPart = null;

document.getElementById('partCount').textContent = parts.length;

parts.forEach((part, i) => {
  const row = document.createElement('div');
  row.className = 'part-item';
  row.dataset.id = part.id;
  row.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span><span class="nm">${part.name}</span>`;
  row.addEventListener('click', () => {
    togglePart(part);
    selectPart(part);
  });
  row.addEventListener('mouseenter', () => { hoveredPart = part; });
  row.addEventListener('mouseleave', () => { if (hoveredPart === part) hoveredPart = null; });
  listEl.appendChild(row);
});

function updateListUI() {
  listEl.querySelectorAll('.part-item').forEach(row => {
    const p = partsById[row.dataset.id];
    row.classList.toggle('active', !!p && p.exploded);
  });
}

function selectPart(part) {
  selectedPart = part;
  if (!part) {
    infoEl.classList.remove('show');
    return;
  }
  infoEl.classList.add('show');
  infoEl.innerHTML = `
    <div class="info-head">
      <h2>${part.name}</h2>
      <span class="en">${part.en}</span>
    </div>
    <div class="info-specs">
      ${part.specs.map(([k, v]) => `<div class="spec-row"><span>${k}</span><b>${v}</b></div>`).join('')}
    </div>
    <p class="info-desc">${part.desc}</p>
    <button class="btn" id="toggleBtn">${part.exploded ? '↩ 复原该部件' : '✦ 拆解该部件'}</button>
  `;
  const tb = infoEl.querySelector('#toggleBtn');
  tb.addEventListener('click', () => togglePart(part));
}

function togglePart(part) {
  part.exploded = !part.exploded;
  updateListUI();
  if (selectedPart === part) selectPart(part);
  syncAllButton();
}

function syncAllButton() {
  const anyExploded = parts.some(p => p.exploded);
  btnAll.textContent = anyExploded ? '全部复位' : '全部拆解';
}

btnAll.addEventListener('click', () => {
  const next = !parts.some(p => p.exploded);
  parts.forEach(p => (p.exploded = next));
  updateListUI();
  syncAllButton();
  if (selectedPart) selectPart(selectedPart);
});

btnReset.addEventListener('click', () => {

  controls.update();
});

// 射线拾取
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownPos = null;

function setPointerFromEvent(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}

renderer.domElement.addEventListener('pointerdown', e => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', e => {
  if (!pointerDownPos) return;
  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  pointerDownPos = null;
  if (dist > 6) return;

  setPointerFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  if (hits.length) {
    const part = partsById[hits[0].object.userData.partId];
    if (part) {
      togglePart(part);
      selectPart(part);
    }
  } else {
    selectPart(null);
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  setPointerFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  const part = hits.length ? partsById[hits[0].object.userData.partId] : null;
  if (part !== hoveredPart) {
    hoveredPart = part;
    renderer.domElement.style.cursor = part ? 'pointer' : 'grab';
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  hoveredPart = null;
  renderer.domElement.style.cursor = 'grab';
});

/* =========================================================
   13. 动画循环
   ========================================================= */
const clock = new THREE.Clock();
const tmpColor = new THREE.Color();
const tmpVec = new THREE.Vector3();

function updateLabels() {
  parts.forEach(part => {
    const visible = part.exploded || part === hoveredPart;
    if (!visible) {
      if (part.labelEl.classList.contains('show')) part.labelEl.classList.remove('show');
      return;
    }
    tmpVec.copy(part.labelAnchor).add(part.group.position);
    tmpVec.project(camera);

    if (tmpVec.z > 1) {
      part.labelEl.classList.remove('show');
      return;
    }

    const x = (tmpVec.x * 0.5 + 0.5) * innerWidth;
    const y = (-tmpVec.y * 0.5 + 0.5) * innerHeight;
    part.labelEl.style.left = x + 'px';
    part.labelEl.style.top = y + 'px';
    part.labelEl.classList.add('show');
  });
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const ease = 1 - Math.pow(0.0015, dt);

  parts.forEach(part => {
    // 拆解位移动画
    const target = part.exploded ? part.explode : ZERO;
    part.group.position.lerp(target, ease);

    // 赛博朋克风高亮脉冲
    const glowTarget = (part.exploded || part === hoveredPart) ? 1 : 0;
    part.glow += (glowTarget - part.glow) * Math.min(1, dt * 10);

    const pulse = part.exploded ? 0.6 + 0.4 * Math.sin(t * 5 + part.group.position.x) : 1;
    const g = part.glow * pulse;

    if (g > 0.005) {
      for (let i = 0; i < part.matData.length; i++) {
        const d = part.matData[i];
        // 亮蓝色发光
        tmpColor.copy(d.baseEmissive).lerp(GLOW_COLOR, g * 0.85);
        d.mat.emissive.copy(tmpColor);
        // 车漆的发光稍微暗一点以免过曝
        d.mat.emissiveIntensity = d.baseIntensity + g * (part.id === 'body' ? 0.4 : 1.5);
      }
    } else if (part.glow > 0) {
      for (let i = 0; i < part.matData.length; i++) {
        const d = part.matData[i];
        d.mat.emissive.copy(d.baseEmissive);
        d.mat.emissiveIntensity = d.baseIntensity;
      }
    }
  });

  glowPoint.intensity = 15 + Math.sin(t * 2) * 8;

  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateListUI();
syncAllButton();
animate();

setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
}, 300);
